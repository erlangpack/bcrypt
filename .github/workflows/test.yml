# Run tests and dialyzer

name: Test

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  linux:
    name: Test on OTP ${{ matrix.otp_version }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        otp_version: [27,28,29]
        os: [ubuntu-latest]

    container:
      image: erlang:${{ matrix.otp_version }}

    steps:
      - uses: actions/checkout@v7
      - name: Compile
        run: make
      - name: Test
        run: make test
      - name: Native security tests
        run: make security-test
      - name: Single-scheduler security tests
        run: ERL_FLAGS="+S 1" rebar3 as test eunit --module=bcrypt_security_tests
      - name: XRef
        run: make xref
      - name: Dialyzer
        run: make dialyzer

  otp22:
    name: Test on OTP 22.3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Keep Node-based actions on the host, outside the old Debian image.
      - uses: actions/checkout@v7
      - name: Test in the OTP 22.3 toolchain
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            erlang:22.3 \
            sh .github/scripts/test-otp22.sh
